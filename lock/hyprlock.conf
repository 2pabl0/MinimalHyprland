# ~/.config/hypr/hyprlock.conf
# Catppuccin Mocha · Mauve (mismos colores que la waybar)

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 6
    brightness = 0.6
}

# Hora
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgba(180, 190, 254, 1.0)
    font_size = 90
    font_family = JetBrainsMono Nerd Font
    position = 0, 180
    halign = center
    valign = center
}

# Fecha
label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %d de %B')"
    color = rgba(205, 214, 244, 1.0)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, 90
    halign = center
    valign = center
}

# Campo de contrasena
input-field {
    monitor =
    size = 300, 55
    outline_thickness = 2
    rounding = 14
    dots_size = 0.25
    dots_spacing = 0.3
    outer_color = rgba(203, 166, 247, 1.0)
    inner_color = rgba(17, 17, 27, 0.9)
    font_color = rgba(205, 214, 244, 1.0)
    check_color = rgba(249, 226, 175, 1.0)
    fail_color = rgba(243, 139, 168, 1.0)
    fade_on_empty = false
    placeholder_text = <span foreground="##a6adc8">  $USER</span>
    fail_text = <span foreground="##f38ba8">$FAIL ($ATTEMPTS)</span>
    position = 0, -40
    halign = center
    valign = center
}
